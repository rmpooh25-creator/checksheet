<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部屋チェックシート</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f4f4f4; }
    .btn { padding: 6px 12px; margin: 2px; cursor: pointer; }
    .btn-danger { background-color: #ff4d4d; color: white; border: none; }
    .btn-primary { background-color: #007bff; color: white; border: none; }
  </style>
</head>
<body>

  <h1>部屋チェックシート</h1>

  <div>
    <input type="text" id="roomInput" placeholder="例: 101 または 101-105">
    <button class="btn btn-primary" onclick="addRoomFromInput()">部屋追加</button>
    <button class="btn btn-danger" onclick="deleteSelectedRooms()">選択した部屋を削除</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>選択</th>
        <th>部屋番号</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="roomList"></tbody>
  </table>

  <script>
    let rooms = JSON.parse(localStorage.getItem("rooms")) || [];

    // 初期描画
    renderRooms();

    // 部屋描画処理
    function renderRooms() {
      const tbody = document.getElementById("roomList");
      tbody.innerHTML = "";

      // 不正なデータ（コード文字列など）を自動除去して表示
      rooms = rooms.filter(room => {
        const name = String(room);
        return !name.includes("function") && !name.includes("{") && name.length <= 20;
      });

      rooms.forEach((room, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input type="checkbox" id="room-check-${index}"></td>
          <td>${room}</td>
          <td><button class="btn btn-danger" onclick="deleteSingleRoom(${index})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });

      saveData();
    }

    // ① 部屋追加処理（コードなどの不正入力を強力ガード）
    function addRoomFromInput() {
      const input = document.getElementById("roomInput");
      const val = input.value.trim();

      if (!val) return;

      // プログラムコードや長文の混入をブロック
      if (val.includes("function") || val.includes("{") || val.includes(";") || val.length > 20) {
        alert("無効な部屋番号です。プログラムコードや特殊文字は入力できません。");
        return;
      }

      rooms.push(val);
      input.value = "";
      renderRooms();
    }

    // ② 選択削除処理（インデックス指定でどんな文字でも確実に削除）
    function deleteSelectedRooms() {
      rooms = rooms.filter((room, index) => {
        const checkbox = document.getElementById(`room-check-${index}`);
        return !checkbox || !checkbox.checked;
      });
      renderRooms();
    }

    // 単体削除処理
    function deleteSingleRoom(index) {
      rooms.splice(index, 1);
      renderRooms();
    }

    // 保存処理
    function saveData() {
      localStorage.setItem("rooms", JSON.stringify(rooms));
    }
  </script>
</body>
</html>
